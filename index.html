<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT XI</title>
    <style>
        /* Reset dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Container utama */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        h3 {
            color: #666666;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Group tombol (Flexbox) */
        .button-group {
            display: flex;
            flex-direction: column; /* Menumpuk secara vertikal di layar kecil */
            gap: 15px; /* Jarak antartombol */
        }

        /* Desain umum tombol */
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        /* Efek hover (saat kursor di atas tombol) */
        .btn:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
        }

        /* TAMPILAN UNTUK TOMBOL NON-AKTIF (DISABLED) */
        .btn.disabled, 
        .btn:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            pointer-events: none; /* Mencegah klik di beberapa browser */
        }

        /* Warna masing-masing tombol */
        .btn-google {
            background-color: #4285F4;
        }
        .btn-google:hover {
            background-color: #3367d6;
        }

        .btn-youtube {
            background-color: #FF0000;
        }
        .btn-youtube:hover {
            background-color: #cc0000;
        }

        .btn-github {
            background-color: #24292e;
        }
        .btn-github:hover {
            background-color: #1b1e21;
        }

        /* STYLE UNTUK POP-UP (MODAL) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.4rem;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover {
            color: #000;
        }

        /* Responsif Media Query */
        @media (min-width: 600px) {
            .container {
                max-width: 700px;
                padding: 50px;
            }
            .button-group {
                flex-direction: row;
                justify-content: center;
            }

            .btn {
                flex: 1; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PRACTICAL EXAM QUESTION - ICT XI</h1>
        <h3>MIDTERM TEST OF 1st SEMESTER - ACADEMIC YEAR OF 2026/2027</h3>
        
        <div class="button-group">
            <a href="https://drive.google.com/file/d/13m7HKJoAWRcHtVrZ-aghqQNmUNhIkFI1/view?usp=sharing" target="_blank" class="btn btn-google">1.Tata Tertib Peserta Ujian Praktik</a>
            <a id="btnSoalUjian" href="https://drive.google.com/drive/folders/1lkwtl5aM8IGUrKX2xznH43iaxDaK8d4T?usp=sharing" target="_blank" class="btn btn-youtube">2.Soal Ujian (Praktik IoT)</a>
            <button id="openModalBtn" class="btn btn-github">3.Upload Jawaban</button>
        </div>
    </div>

    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <h2>Pilih Sekolah - Upload Jawaban</h2>
            <div class="button-group">
                <a href="https://forms.gle/U5vHLev7F88e5gdg7" target="_blank" class="btn btn-google">SMA ABBS Surakarta</a>
                <a href="https://bit.ly/4Ah6YG4" target="_blank" class="btn btn-youtube">SMA ABBS Sukoharjo</a>
                <a href="https://forms.gle/FGf2uVqnvBDnYDQn8" target="_blank" class="btn btn-github">SMA ABBS Boyolali</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const uploadModal = document.getElementById('uploadModal');

        openModalBtn.addEventListener('click', () => {
            if (!openModalBtn.disabled) {
                uploadModal.classList.add('active');
            }
        });
        closeModalBtn.addEventListener('click', () => {
            uploadModal.classList.remove('active');
        });
        window.addEventListener('click', (event) => {
            if (event.target === uploadModal) {
                uploadModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
